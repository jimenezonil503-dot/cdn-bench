<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">移动网络访问的诊断顺序 · 检查重点</title><desc id="desc">地区与运营商 → IPv4与IPv6 → 错误与内容</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1000" height="420" rx="24" fill="#0e1524"/><path d="M0 114H1000" stroke="#29364b"/><text x="40" y="48" font-size="24" font-weight="600" fill="#e9edf5">移动网络访问的诊断顺序 · 检查重点</text><text x="40" y="76" font-size="13" fill="#9eacc2">Mobile-network diagnosis / review points</text><rect x="40" y="157" width="288" height="140" rx="16" fill="#153d36" stroke="#4cbd99"/><circle cx="68" cy="187" r="14" fill="#61d9b2"/><text x="68" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#10241f">1</text><text x="58" y="238" font-size="18" font-weight="600" fill="#e9edf5">地区与运营商</text><text x="58" y="266" font-size="13" fill="#9eacc2">Region / carrier</text><rect x="356" y="157" width="288" height="140" rx="16" fill="#182438" stroke="#35445c"/><circle cx="384" cy="187" r="14" fill="#61d9b2"/><text x="384" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#10241f">2</text><text x="374" y="238" font-size="18" font-weight="600" fill="#e9edf5">IPv4与IPv6</text><text x="374" y="266" font-size="13" fill="#9eacc2">IPv4 / IPv6</text><rect x="672" y="157" width="288" height="140" rx="16" fill="#182438" stroke="#35445c"/><circle cx="700" cy="187" r="14" fill="#61d9b2"/><text x="700" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#10241f">3</text><text x="690" y="238" font-size="18" font-weight="600" fill="#e9edf5">错误与内容</text><text x="690" y="266" font-size="13" fill="#9eacc2">Errors / content</text><text x="40" y="354" font-size="15" fill="#bdc8d9">将三个检查面分别留存证据，再作业务判断。</text><text x="40" y="381" font-size="13" fill="#8493ab">Retain evidence for each review area before making a workload decision.</text></g></svg>
