<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">网站CDN采购流程</title><desc id="desc">入口清单 → 证书与缓存 → 试点与切换 → 回退与续费</desc><g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><rect width="1000" height="420" rx="24" fill="#0e1524"/><path d="M0 114H1000" stroke="#29364b"/><text x="40" y="48" font-size="24" font-weight="600" fill="#e9edf5">网站CDN采购流程</text><text x="40" y="76" font-size="13" fill="#9eacc2">Website CDN procurement</text><rect x="42" y="157" width="208" height="140" rx="16" fill="#153d36" stroke="#4cbd99"/><circle cx="70" cy="187" r="14" fill="#61d9b2"/><text x="70" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#10241f">1</text><text x="60" y="238" font-size="18" font-weight="600" fill="#e9edf5">入口清单</text><text x="60" y="266" font-size="13" fill="#9eacc2">Ingress inventory</text><path d="M255 224h17m-6-5 6 5-6 5" fill="none" stroke="#61d9b2" stroke-width="2"/><rect x="278" y="157" width="208" height="140" rx="16" fill="#182438" stroke="#35445c"/><circle cx="306" cy="187" r="14" fill="#61d9b2"/><text x="306" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#10241f">2</text><text x="296" y="238" font-size="18" font-weight="600" fill="#e9edf5">证书与缓存</text><text x="296" y="266" font-size="13" fill="#9eacc2">TLS / cache</text><path d="M491 224h17m-6-5 6 5-6 5" fill="none" stroke="#61d9b2" stroke-width="2"/><rect x="514" y="157" width="208" height="140" rx="16" fill="#182438" stroke="#35445c"/><circle cx="542" cy="187" r="14" fill="#61d9b2"/><text x="542" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#10241f">3</text><text x="532" y="238" font-size="18" font-weight="600" fill="#e9edf5">试点与切换</text><text x="532" y="266" font-size="13" fill="#9eacc2">Pilot / rollout</text><path d="M727 224h17m-6-5 6 5-6 5" fill="none" stroke="#61d9b2" stroke-width="2"/><rect x="750" y="157" width="208" height="140" rx="16" fill="#182438" stroke="#35445c"/><circle cx="778" cy="187" r="14" fill="#61d9b2"/><text x="778" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#10241f">4</text><text x="768" y="238" font-size="18" font-weight="600" fill="#e9edf5">回退与续费</text><text x="768" y="266" font-size="13" fill="#9eacc2">Rollback / renewal</text><text x="40" y="354" font-size="15" fill="#bdc8d9">按箭头逐段验证，结合正文核对条件与限制。</text><text x="40" y="381" font-size="13" fill="#8493ab">Verify each stage against the conditions explained in the article.</text></g></svg>
